<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contextly · Personal Compass</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#294537;background:#f7f8f3}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:225px 1fr;min-height:100vh}aside{background:#eaf0e8;padding:26px 15px;border-right:1px solid #dce7dc}aside h2{color:#3a7053;margin:0 10px 5px}aside small{margin:0 10px;color:#849989}nav{margin-top:35px}nav button{width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;color:#52725e;margin:2px 0}nav button.active,nav button:hover{background:#d5e5d7;color:#24563b;font-weight:700}main{padding:38px;max-width:1120px;width:100%;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:#779780;text-transform:uppercase;font-weight:800}h1{font-size:35px;margin:6px 0 12px;letter-spacing:-1px}h2{margin:0 0 12px}p{color:#73877b;line-height:1.6}.hero{background:#e6efe3;border-radius:22px;padding:28px;margin:22px 0 28px}.hero p{max-width:650px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{background:#fffefa;border:1px solid #e1e9df;border-radius:17px;padding:22px;margin-bottom:16px}.wide{grid-column:1/-1}.card h3{margin:0 0 10px}.muted{color:#789083;font-size:13px}.pill{display:inline-block;border-radius:40px;padding:6px 11px;background:#e7f1e6;color:#436d53;font-size:12px;margin:4px}.btn{background:#3c7054;border:0;color:white;border-radius:9px;padding:10px 15px;font-weight:700;margin:4px 5px 4px 0}.btn.secondary{background:#e8f0e7;color:#426d52}.btn.danger{background:#f7e6e2;color:#9c5148}.field{display:block;margin:12px 0;color:#55715f;font-size:13px;font-weight:700}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid #dce5dc;border-radius:9px;padding:11px;background:white;margin-top:6px;color:#294537}.field textarea{min-height:90px}.choices{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.choice{border:1px solid #d7e4d8;background:#fff;border-radius:11px;padding:13px;color:#355640}.choice.on{background:#dbeadd;border-color:#57846a}.listitem{padding:13px 0;border-bottom:1px solid #e9eee8;display:flex;align-items:center;justify-content:space-between;gap:12px}.listitem:last-child{border:0}.bar{height:13px;border-radius:9px;background:#e7eee6;overflow:hidden;margin:7px 0 15px}.bar div{height:100%;background:#79a78a}.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.swatch{height:100px;border-radius:12px;padding:12px;display:flex;align-items:end;font-weight:700;font-size:12px}.swatch.on{outline:3px solid #497a5d;outline-offset:2px}.empty{padding:20px;border:1px dashed #cadbcb;border-radius:12px;color:#819487}.foot{font-size:12px;color:#879b8b;margin-top:30px}@media(max-width:760px){.layout{display:block}aside{position:static}nav{display:flex;overflow-x:auto;margin-top:15px}nav button{white-space:nowrap;width:auto}main{padding:22px}.grid{grid-template-columns:1fr}.swatches{grid-template-columns:1fr 1fr}}
</style></head><body><div class="layout"><aside><h2>✳ contextly</h2><small>grow into yourself</small><nav id="nav"></nav></aside><main><div class="eyebrow">YOUR PERSONAL COMPASS</div><div id="app"></div><div class="foot">Private demo · Your entries are stored only in this browser using localStorage. No AI service or database is connected.</div></main></div><script>
const KEY='contextly-demo-v1';
const seed={mood:{},time:[],goals:[],dreams:[],friends:[],ideal:'',values:[]};
let data;try{data={...seed,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){data=structuredClone(seed)}
let page='Home',step=0;
const pages=['Home','Mood Quiz','Time Audit','SPACE Goals','Dreams List','Friends List','Ideal Self','Core Values'];
const icons=['⌂','☀','◷','◎','✦','♡','◈','❋'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(data));
const card=(title,body,cls='')=>'<section class="card '+cls+'"><h3>'+title+'</h3>'+body+'</section>';
const btn=(label,fn,cls='')=>'<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>';
const input=(label,id,placeholder='',type='text')=>'<label class="field">'+label+'<input id="'+id+'" type="'+type+'" placeholder="'+placeholder+'"></label>';
const area=(label,id,placeholder='')=>'<label class="field">'+label+'<textarea id="'+id+'" placeholder="'+placeholder+'"></textarea></label>';
function go(p){page=p;step=0;render();window.scrollTo(0,0)}
function render(){ $('#nav').innerHTML=pages.map((p,i)=>'<button class="'+(p===page?'active':'')+'" onclick="go(\''+p+'\')">'+icons[i]+' &nbsp;'+p+'</button>').join('');$('#app').innerHTML=views[page]()}
const count=k=>data[k].length;
const summary=(name,text)=>card(name,text);
const list=(k,fn)=>data[k].length?data[k].map((x,i)=>'<div class="listitem"><div>'+fn(x)+'</div>'+btn('Remove','removeItem(\''+k+'\','+i+')','danger')+'</div>').join(''):'<div class="empty">Nothing here yet. Add your first entry.</div>';
function removeItem(k,i){data[k].splice(i,1);save();render()}
function addItem(k,fields){const item={};for(const f of fields){item[f]=$('#'+f).value.trim()}if(!item[fields[0]])return alert('Please fill in the first field.');data[k].push(item);save();render()}
const questions=[
{title:'Which interface feels most like you?',choices:['Calm & minimal','Playful & colorful','Structured & analytical','Cozy & journal-like']},
{title:'What motivates you to keep going?',choices:['A gentle nudge','Visible progress','A clear plan','Encouragement from friends']},
{title:'What should your home screen emphasize?',choices:['A moment to reflect','My goals and next steps','Charts and insights','People and connection']},
{title:'How do you prefer to check in?',choices:['Quick multiple choice','A few journal prompts','Sliders and numbers','Visual cards and icons']}
];
const palettes=[['Calm & minimal','#e3ede5','#789e84'],['Playful & colorful','#f5d8bd','#a2b8e3'],['Structured & analytical','#dbe5ee','#68869c'],['Cozy & journal-like','#f3e6d7','#bb987c']];
const views={
Home(){const total=count('goals')+count('dreams')+count('friends');return '<h1>A little more you, every day.</h1><p>Make space for what matters. Reflect, dream, connect, and build a picture of who you are becoming.</p><div class="hero"><div class="eyebrow">YOUR GROWTH GARDEN</div><h2>Your life, in the making 🌱</h2><p>These small reflections add up to a richer understanding of your values, relationships, ambitions, and rhythms.</p>'+btn('Explore activities','go(\'Mood Quiz\')')+'</div><div class="grid">'+card('Your north star','<p>'+(data.ideal?esc(data.ideal):'Write a vision of your ideal self to see it here.')+'</p>'+btn('Reflect','go(\'Ideal Self\')','secondary'))+card('What matters most','<p>'+(data.values.length?data.values.map(v=>'<span class="pill">'+esc(v)+'</span>').join(''):'Choose your core values to anchor your choices.')+'</p>'+btn('Sort values','go(\'Core Values\')','secondary'))+card('Goals in motion','<div style="font-size:30px;font-weight:800">'+count('goals')+'</div><p>SPACE goals you are nurturing</p>'+data.goals.slice(0,3).map(g=>'<span class="pill">'+esc(g.title)+'</span>').join(''))+card('Dreams worth chasing','<div style="font-size:30px;font-weight:800">'+count('dreams')+'</div><p>Possibilities on your horizon</p>'+data.dreams.slice(0,3).map(d=>'<span class="pill">'+esc(d.title)+'</span>').join(''))+card('Your people','<div style="font-size:30px;font-weight:800">'+count('friends')+'</div><p>Relationships to nurture</p>')+card('Your vibe','<p>'+(Object.keys(data.mood).length===4?'Quiz complete · '+esc(data.mood[0]):'Discover how you like to be supported.')+'</p>'+btn('Take quiz','go(\'Mood Quiz\')','secondary'))+'</div><p class="muted">'+total+' long-term entries saved in this browser.</p>'},
'Mood Quiz'(){const q=questions[step];return '<h1>Find your vibe ☀</h1><p>A short style quiz to personalize the look and feel of your future coaching experiences.</p>'+card('Question '+(step+1)+' of '+questions.length,'<h2>'+q.title+'</h2><div class="choices">'+q.choices.map(c=>'<button class="choice '+(data.mood[step]===c?'on':'')+'" onclick="answerMood('+step+',\''+c.replace(/'/g,"\\'")+'\')">'+c+'</button>').join('')+'</div>'+btn('Back','quizBack()','secondary')+btn(step===3?'See my vibe →':'Next →','quizNext()'))+card('Choose a UI direction','<p>These miniature color palettes represent different interface styles. Pick the one that feels right.</p><div class="swatches">'+palettes.map(([name,a,b])=>'<button class="swatch '+(data.mood.palette===name?'on':'')+'" style="background:linear-gradient(135deg,'+a+' 55%,'+b+' 55%);color:#314a3d;border:0" onclick="choosePalette(\''+name+'\')">'+name+'</button>').join('')+'</div>')+(Object.keys(data.mood).filter(k=>k!=='palette').length===4?card('Your style profile','<p>You lean toward <strong>'+esc(data.mood[0])+'</strong> interfaces, and prefer <strong>'+esc(data.mood[1])+'</strong>. Your chosen visual direction is <strong>'+esc(data.mood.palette||'not selected')+'</strong>.</p><p class="muted">Demo inference based on your answers, not a connected AI model.</p>'):'')},
'Time Audit'(){const categories=['Work / Study','Sleep','Friends / Family','Health','Leisure','Chores','Other'];const totals={};let sum=0;data.time.forEach(t=>{const h=Number(t.hours)||0;totals[t.category]=(totals[t.category]||0)+h;sum+=h});return '<h1>Where does your time go? ◷</h1><p>Record how you spent your day. Notice what energizes you and what deserves more space.</p><div class="grid">'+card('Log an activity',input('Activity','activity','Reading, scrolling, walking…')+input('Hours','hours','1.5','number')+'<label class="field">Category<select id="category">'+categories.map(c=>'<option>'+c+'</option>').join('')+'</select></label>'+btn('Add time entry','addTime()'))+card('Your time snapshot','<h2>'+sum.toFixed(1)+' hours logged</h2>'+Object.entries(totals).map(([k,v])=>'<small>'+esc(k)+' · '+v.toFixed(1)+'h</small><div class="bar"><div style="width:'+Math.min(100,100*v/Math.max(sum,1))+'%"></div></div>').join('')+(sum===0?'<p>No activities logged yet.</p>':''))+'</div>'+card('Activity log',list('time',t=>'<strong>'+esc(t.activity)+'</strong><div class="muted">'+esc(t.category)+' · '+esc(t.hours)+' hours</div>'))},
'SPACE Goals'(){return '<h1>Give your goals room to grow ◎</h1><p>SPACE is a guided reflection framework: Specific, Positive, Actionable, Connected, and Energizing. Define goals that fit your life.</p>'+card('Set a SPACE goal',input('Goal title','title','e.g. Build a consistent morning routine')+area('S · Specific — What exactly do you want?','specific')+area('P · Positive — What will improve?','positive')+area('A · Actionable — What is your first step?','actionable')+area('C · Connected — Why does this matter to you?','connected')+area('E · Energizing — What makes it motivating?','energizing')+btn('Save goal','addItem(\'goals\',[\'title\',\'specific\',\'positive\',\'actionable\',\'connected\',\'energizing\'])'))+card('Your growing goals',list('goals',g=>'<strong>'+esc(g.title)+'</strong><p>'+esc(g.actionable)+'</p><span class="pill">'+esc(g.connected||'Personal growth')+'</span>'))},
'Dreams List'(){return '<h1>Keep your dreams close ✦</h1><p>Big, small, practical, impossible—give your wishes a place to live.</p>'+card('Add a dream',input('What do you dream of?','title','e.g. Spend a summer in Japan')+area('Why does this dream matter?','why')+'<label class="field">Horizon<select id="horizon"><option>Someday</option><option>This year</option><option>Next 5 years</option></select></label>'+btn('Add dream','addItem(\'dreams\',[\'title\',\'why\',\'horizon\'])'))+card('Your dream collection',list('dreams',d=>'<strong>✦ '+esc(d.title)+'</strong><p>'+esc(d.why)+'</p><span class="pill">'+esc(d.horizon)+'</span>'))},
'Friends List'(){return '<h1>The people in your corner ♡</h1><p>Celebrate the relationships that make your world feel bigger and warmer.</p>'+card('Remember someone',input('Name','name','Friend’s name')+input('How you know them','relation','College, family, neighborhood…')+area('Something you appreciate about them','appreciation')+btn('Add person','addItem(\'friends\',[\'name\',\'relation\',\'appreciation\'])'))+card('Your people',list('friends',f=>'<strong>♡ '+esc(f.name)+'</strong><div class="muted">'+esc(f.relation)+'</div><p>'+esc(f.appreciation)+'</p>'))},
'Ideal Self'(){return '<h1>Meet your future self ◈</h1><p>Imagine a version of you who feels aligned, grounded, and fulfilled. What does their everyday life look like?</p>'+card('A letter from your future self','<p>Try writing in the present tense. Describe your routines, relationships, strengths, and the way you feel.</p>'+area('My ideal self…','ideal','I wake up feeling…')+btn('Save my vision','saveIdeal()'))+card('Your north star','<p>'+(data.ideal?esc(data.ideal).replace(/\n/g,'<br>'):'Your vision will appear here after you save it.')+'</p>')},
'Core Values'(){const vals=['Curiosity','Kindness','Freedom','Creativity','Family','Growth','Courage','Health','Community','Honesty','Adventure','Stability','Learning','Love','Integrity','Balance','Service','Joy','Wisdom','Independence'];return '<h1>What matters at your core? ❋</h1><p>Choose up to five values that feel most important right now. Revisit them as you evolve.</p>'+card('Sort your values','<p class="muted">Selected '+data.values.length+' of 5</p><div class="choices">'+vals.map(v=>'<button class="choice '+(data.values.includes(v)?'on':'')+'" onclick="toggleValue(\''+v+'\')">'+(data.values.includes(v)?'✓ ':'')+v+'</button>').join('')+'</div>')+card('Your personal compass',data.values.length?data.values.map((v,i)=>'<span class="pill">'+(i+1)+'. '+esc(v)+'</span>').join('')+'<p class="muted">Click a selected value to remove it. Your selection is saved automatically.</p>':'<div class="empty">Select a few values to begin.</div>')}
};
function answerMood(i,c){data.mood[i]=c;save();render()}
function choosePalette(p){data.mood.palette=p;save();render()}
function quizBack(){step=Math.max(0,step-1);render()}
function quizNext(){if(!data.mood[step])return alert('Choose an answer first.');step=Math.min(3,step+1);render()}
function addTime(){const activity=$('#activity').value.trim(),hours=Number($('#hours').value),category=$('#category').value;if(!activity||!Number.isFinite(hours)||hours<=0||hours>24)return alert('Enter an activity and a valid number of hours (0–24).');data.time.push({activity,hours,category});save();render()}
function saveIdeal(){data.ideal=$('#ideal').value.trim();save();render()}
function toggleValue(v){if(data.values.includes(v))data.values=data.values.filter(x=>x!==v);else if(data.values.length<5)data.values.push(v);else return alert('Choose up to five values.');save();render()}
render();if(page==='Ideal Self')$('#ideal').value=data.ideal;
</script></body></html>
